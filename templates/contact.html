<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
    <body class="body watermark_img">
    
        <div class="main1 "  style="height:60px;">
            <div class="first"> 
                <div class="logo">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="logo" class="image" height="50px" width="50px" style="background-color: #0B3142; border-radius: 50%;">
                    
                </div>
                <div class="navbar">
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/about">About Us</a></li>
                        <li><a href="/contact">Contact Us</a></li>  
                    </ul>
                </div>
                <div class="title">
                <p >College Recommendation System</p>
                </div>
            </div>
        </div>
        <div class="middle">
            <div class="container scrollable">
                <h1>Contact Us</h1>
                <form action="/submit-feedback" method="POST">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" style="width:500px;"  class="form2" id="name" name="name" required><br><br>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" style="width:500px;" class="form3" id="email" name="email" required><br><br>
                    </div>
                    <div class="form-group">
                        <label for="organization">Organization:</label>
                        <input type="text" style="width:450px;"  class="form1" id="organization" name="organization"><br><br>
                    </div>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea style="width:480px;"  class="form4" id="message" name="message" rows="5" required></textarea><br><br>
                    </div>
                    <button type="submit" class="butn">Submit</button>
                </form>
            </div>
        </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
